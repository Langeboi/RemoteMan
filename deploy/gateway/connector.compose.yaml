# RemoteMan gateway connector: runs inside a remote network (school lab, a friend's homelab, behind CG-NAT).
# It only connects out to the relay on 443, so no port forwarding is needed. `gateway site add <name>` on the
# relay prints this file with the right RELAY_URL and SITE_TOKEN filled in.
services:
  connector:
    image: ghcr.io/langeboi/remoteman-gateway:test
    container_name: remoteman-connector
    command: connector
    # The host's own DNS and routes: internal names (server.school.local) resolve and every subnet the machine
    # reaches is reachable. On Docker's default network, a host using systemd-resolved hands containers public DNS.
    network_mode: host
    restart: unless-stopped
    environment:
      RELAY_URL: https://remoteman.mydomain.dk
      SITE_TOKEN: paste-the-site-token-here
      NAME: school-1                        # shown on the relay; give a second connector for failover another name
      # ALLOW: 10.20.0.0/16,192.168.1.10    # what it may open; default every private range. "*" = anything
    volumes:
      - connector-data:/data                # the connector's key; keep it so RemoteMan keeps trusting it

volumes:
  connector-data:
