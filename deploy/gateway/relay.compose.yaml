# RemoteMan gateway relay: the one public piece. Run it at home (or on any box with a public IP) and point a
# DNS name at it. Caddy gets a Let's Encrypt certificate for that name by itself and forwards to the relay.
#
#   1. DNS: an A record for remoteman.mydomain.dk -> your public IP. Router: forward TCP 443 (and 80) to this box.
#   2. Change DOMAIN below, then:  docker compose -f relay.compose.yaml up -d
#   3. docker logs remoteman-relay: open the one-time link it prints to create the admin console's first admin,
#      then add sites, connectors and devices at https://remoteman.mydomain.dk/rmrelay/
#      (or by hand: docker exec -it remoteman-relay gateway site add school / gateway invite)
services:
  relay:
    image: ghcr.io/langeboi/remoteman-gateway:test     # :latest once there is a release
    container_name: remoteman-relay
    command: relay
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://remoteman.mydomain.dk          # the address RemoteMan and connectors use
      TZ: Europe/Copenhagen
      # ADMIN_ALLOW: 192.168.0.0/16                      # only these addresses may open the admin console (/rmrelay)
      # ADMIN: "off"                                     # no web console at all; the CLI still works
      # Hosted workspaces (optional): a PostgreSQL server of its own, see deploy/hosted/README.md
      # HOSTED_DB: Host=db.remoteman.mydomain.dk;Username=postgres;Password=…;SSL Mode=VerifyFull;Root Certificate=/data/hosted-ca.pem
      # HOSTED_DB_CA: /data/hosted-ca.pem
      # BACKUP_AT: "03:00"
    volumes:
      - relay-data:/data                                 # sites, devices, console admins (secrets stored hashed), activity

  caddy:
    image: caddy:2
    container_name: remoteman-relay-caddy
    restart: unless-stopped
    # Same name as PUBLIC_URL. Caddy renews the certificate on its own.
    command: caddy reverse-proxy --from remoteman.mydomain.dk --to relay:8080
    ports:
      - "443:443"
      - "80:80"          # Let's Encrypt's HTTP check and the redirect to https; optional (443 alone works too)
    volumes:
      - caddy-data:/data

volumes:
  relay-data:
  caddy-data:
