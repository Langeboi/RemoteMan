name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build Tether.sln -c Release
      - run: dotnet test tests/Tether.Tests -c Release --no-build
      - run: dotnet publish src/Tether.App -c Release -r win-x64 --self-contained false -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: tether-win-x64
          path: publish
