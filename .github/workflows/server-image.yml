name: server image

# Builds the RemoteMan server container (deploy/docker) for amd64 and arm64 and pushes it to GitHub's
# container registry: ghcr.io/<owner>/remoteman-server
#   test/all-features  -> :test   (test builds)
#   main               -> :edge
#   tag v1.2.3         -> :1.2.3 and :latest
# Running servers upgrade with: docker compose pull && docker compose up -d

on:
  push:
    branches: [test/all-features, main]
    tags: ['v*']
    paths:
      - deploy/**
      - '!deploy/gateway/**'
      - .github/workflows/server-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tags
        id: tags
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="ghcr.io/$owner/remoteman-server"
          short="${GITHUB_SHA::7}"
          case "$GITHUB_REF" in
            refs/tags/v*)   v="${GITHUB_REF_NAME#v}"; tags="$repo:$v,$repo:latest"; channel=latest; version="$v" ;;
            refs/heads/main) tags="$repo:edge,$repo:edge-$short"; channel=edge; version="edge-$short" ;;
            *)              tags="$repo:test,$repo:test-$short"; channel=test; version="test-$short" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "image=$repo:$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            IMAGE=${{ steps.tags.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
